<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理 - 课堂考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-xl py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-book me-2"></i>课程管理</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> 返回首页
            </a>
            <a class="btn btn-success" th:href="@{/course/add}">
                <i class="bi bi-plus-circle"></i> 新增课程
            </a>
        </div>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${successMsg}" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMsg}" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>课程代码</th>
                    <th>课程名称</th>
                    <th>班级名称</th>
                    <th>授课教师</th>
                    <th>教室</th>
                    <th>上课时间</th>
                    <th>下课时间</th>
                    <th>星期</th>
                    <th>学期</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.code}">CS101</td>
                    <td th:text="${course.name}">Java程序设计</td>
                    <td th:text="${course.className}">软件工程1班</td>
                    <td th:text="${course.teacherName}">张老师</td>
                    <td th:text="${course.classroom}">A101</td>
                    <td th:text="${course.startTime}">08:00</td>
                    <td th:text="${course.endTime}">10:00</td>
                    <td>
                        <span th:switch="${course.weekDay}">
                            <span th:case="MONDAY">周一</span>
                            <span th:case="TUESDAY">周二</span>
                            <span th:case="WEDNESDAY">周三</span>
                            <span th:case="THURSDAY">周四</span>
                            <span th:case="FRIDAY">周五</span>
                            <span th:case="SATURDAY">周六</span>
                            <span th:case="SUNDAY">周日</span>
                            <span th:case="*" th:text="${course.weekDay}">-</span>
                        </span>
                    </td>
                    <td th:text="${course.semester}">1</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/course/edit/{id}(id=${course.id})}">
                            <i class="bi bi-pencil"></i> 编辑
                        </a>
                        <form th:action="@{/course/delete/{id}(id=${course.id})}" method="post"
                              style="display:inline" onsubmit="return confirm('确定要删除该课程吗？')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="10" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>暂无课程信息，请先添加课程
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/course/list(page=${currentPage - 1})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/course/list(page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/course/list(page=${currentPage + 1})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
