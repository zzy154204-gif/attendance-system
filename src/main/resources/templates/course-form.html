<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">课程表单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">
                        <i class="bi bi-book"></i> <span th:text="${formTitle}">课程表单</span>
                    </h3>

                    <form th:action="@{${formAction}}" method="post" th:object="${course}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">课程代码 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{code}"
                                       placeholder="如：CS101" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">课程名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}"
                                       placeholder="如：Java程序设计" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">班级名称</label>
                                <input type="text" class="form-control" th:field="*{className}"
                                       placeholder="如：软件工程1班">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">授课教师</label>
                                <input type="text" class="form-control" th:field="*{teacherName}"
                                       placeholder="如：张老师">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">教室</label>
                                <input type="text" class="form-control" th:field="*{classroom}"
                                       placeholder="如：A101">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">上课时间</label>
                                <input type="time" class="form-control" th:field="*{startTime}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">下课时间</label>
                                <input type="time" class="form-control" th:field="*{endTime}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">星期</label>
                                <select class="form-select" th:field="*{weekDay}">
                                    <option value="">请选择</option>
                                    <option value="MONDAY">周一</option>
                                    <option value="TUESDAY">周二</option>
                                    <option value="WEDNESDAY">周三</option>
                                    <option value="THURSDAY">周四</option>
                                    <option value="FRIDAY">周五</option>
                                    <option value="SATURDAY">周六</option>
                                    <option value="SUNDAY">周日</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">学期</label>
                                <input type="number" class="form-control" th:field="*{semester}"
                                       placeholder="如：1" min="1" max="8">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4">保存</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/course/list}">返回列表</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
