<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教师端 — 课堂考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <style>
        .stat-card {
            border: none;
            border-radius: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .stat-icon { font-size: 2.5rem; opacity: 0.7; }
        .stat-value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .stat-label { font-size: 0.85rem; color: rgba(255,255,255,0.85); }
        .bg-gradient-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bg-gradient-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .bg-gradient-orange { background: linear-gradient(135deg, #fa8231 0%, #fbba36 100%); }
        .bg-gradient-purple { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .rate-bar { height: 10px; border-radius: 5px; }
        .course-stat-item { border-left: 4px solid #0d6efd; transition: background 0.15s; }
        .course-stat-item:hover { background: #f8f9fa; }
    </style>
</head>
<body class="bg-light min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-xl py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-briefcase-fill text-primary me-2"></i>教师工作台</h3>
            <p class="text-muted mb-0">欢迎回来，<span th:text="${welcomeMsg}" class="fw-medium">老师</span></p>
        </div>
        <span class="badge bg-primary rounded-pill px-3 py-2"><i class="bi bi-person-badge me-1"></i>教师</span>
    </div>

    <!-- Stat Cards Row -->
    <div class="row g-3 mb-4">
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card bg-gradient-blue text-white p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-value" th:text="${stats.totalStudents()}">0</div>
                        <div class="stat-label">学生总数</div>
                    </div>
                    <i class="bi bi-people-fill stat-icon"></i>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card bg-gradient-green text-white p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-value" th:text="${stats.todayCheckIns()}">0</div>
                        <div class="stat-label">今日打卡人次</div>
                    </div>
                    <i class="bi bi-clock-fill stat-icon"></i>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card bg-gradient-orange text-white p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-value" th:text="${stats.todayDistinctStudents()}">0</div>
                        <div class="stat-label">今日已打卡人数</div>
                    </div>
                    <i class="bi bi-person-check-fill stat-icon"></i>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card bg-gradient-purple text-white p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-value" th:text="${stats.monthRate() + '%'}">100%</div>
                        <div class="stat-label">本月出勤率</div>
                    </div>
                    <i class="bi bi-graph-up-arrow stat-icon"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Monthly Overview -->
        <div class="col-xl-8">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-3 pb-0">
                    <h5 class="fw-bold"><i class="bi bi-calendar3 me-2 text-primary"></i>本月考勤总览</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3 mb-3">
                        <div class="col-sm-4">
                            <div class="bg-light rounded-3 p-3 text-center">
                                <div class="fs-3 fw-bold text-primary" th:text="${stats.monthTotal()}">0</div>
                                <small class="text-muted">总打卡人次</small>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="bg-light rounded-3 p-3 text-center">
                                <div class="fs-3 fw-bold text-success" th:text="${stats.monthNormal()}">0</div>
                                <small class="text-muted">正常</small>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="bg-light rounded-3 p-3 text-center">
                                <div class="fs-3 fw-bold text-danger" th:text="${stats.monthLate()}">0</div>
                                <small class="text-muted">迟到</small>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted mb-1">
                        <span>出勤率</span><span th:text="${stats.monthRate() + '%'}">100%</span>
                    </div>
                    <div class="progress rate-bar mb-4">
                        <div class="progress-bar bg-success" role="progressbar"
                             th:style="'width:' + ${stats.monthRate()} + '%'"
                             th:attr="aria-valuenow=${stats.monthRate()}"></div>
                    </div>
                    <!-- Course Breakdown -->
                    <h6 class="fw-bold mb-2">各课程打卡统计</h6>
                    <div th:if="${#lists.isEmpty(stats.courseStats())}" class="text-muted small">本月暂无打卡记录</div>
                    <div th:each="cs : ${stats.courseStats()}" class="d-flex justify-content-between align-items-center course-stat-item rounded-2 px-3 py-2 mb-1">
                        <span th:text="${cs.courseName()}" class="fw-medium">课程名</span>
                        <span class="badge bg-primary rounded-pill" th:text="${cs.count() + ' 次'}">0 次</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="col-xl-4">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-3 pb-0">
                    <h5 class="fw-bold"><i class="bi bi-lightning-charge me-2 text-warning"></i>快捷操作</h5>
                </div>
                <div class="card-body d-flex flex-column gap-2">
                    <a class="btn btn-outline-primary text-start" th:href="@{/student/list}">
                        <i class="bi bi-people me-2"></i>学生管理
                    </a>
                    <a class="btn btn-outline-success text-start" th:href="@{/student/add}">
                        <i class="bi bi-person-plus me-2"></i>新增学生
                    </a>
                    <a class="btn btn-outline-info text-start" th:href="@{/attendance/list}">
                        <i class="bi bi-list-ul me-2"></i>考勤记录
                    </a>
                    <a class="btn btn-outline-warning text-start" th:href="@{/attendance/import}">
                        <i class="bi bi-upload me-2"></i>批量导入
                    </a>
                    <a class="btn btn-outline-secondary text-start" th:href="@{/attendance/export}">
                        <i class="bi bi-download me-2"></i>导出 CSV
                    </a>
                    <a class="btn btn-outline-success text-start" th:href="@{/attendance/exportExcel}">
                        <i class="bi bi-file-earmark-excel me-2"></i>导出 Excel
                    </a>
                    <a class="btn btn-outline-info text-start" th:href="@{/course/list}">
                        <i class="bi bi-book me-2"></i>课程管理
                    </a>
                </div>
            </div>
        </div>

        <!-- QR Code Card -->
        <div class="col-12 mt-3">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-0 pt-3 pb-0">
                    <h5 class="fw-bold"><i class="bi bi-qr-code me-2 text-primary"></i>课堂签到二维码</h5>
                    <p class="text-muted small mb-0">学生扫码即可进入系统登录打卡</p>
                </div>
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-auto text-center mb-3 mb-md-0">
                            <div id="qrcode" class="d-inline-block border rounded-3 p-2 bg-white"></div>
                        </div>
                        <div class="col-md">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">访问地址</label>
                                <div class="input-group">
                                    <input type="text" id="baseUrl" class="form-control font-monospace"
                                           placeholder="例如：https://xxx.ngrok-free.app">
                                    <button class="btn btn-primary" type="button" onclick="generateQR()">
                                        <i class="bi bi-arrow-repeat"></i> 生成二维码
                                    </button>
                                </div>
                                <small class="text-muted">使用 ngrok 等工具时，在此填入外网访问地址，然后点击生成</small>
                            </div>
                            <div class="d-flex gap-2 flex-wrap">
                                <button class="btn btn-outline-secondary btn-sm" onclick="setUrl('/login')">
                                    <i class="bi bi-box-arrow-in-right"></i> 登录页
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="setUrl('/attendance/checkIn')">
                                    <i class="bi bi-check-circle"></i> 打卡页
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="useLocalhost()">
                                    <i class="bi bi-pc-display"></i> 本机地址
                                </button>
                            </div>
                            <div class="mt-2">
                                <small class="text-muted">当前链接：</small>
                                <code id="currentUrl" class="text-break"></code>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
    let qrCode = null;

    function getBaseUrl() {
        // 返回当前页面的 origin，供 ngrok 等外网使用
        return window.location.origin;
    }

    function generateQR() {
        const input = document.getElementById('baseUrl');
        let base = input.value.trim();
        if (!base) {
            base = getBaseUrl();
            input.value = base;
        }
        // 去掉末尾斜杠
        base = base.replace(/\/+$/, '');
        const targetUrl = base + '/login';
        document.getElementById('currentUrl').textContent = targetUrl;

        const container = document.getElementById('qrcode');
        container.innerHTML = '';
        qrCode = new QRCode(container, {
            text: targetUrl,
            width: 220,
            height: 220,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    function setUrl(path) {
        const input = document.getElementById('baseUrl');
        const base = (input.value.trim() || getBaseUrl()).replace(/\/+$/, '');
        const targetUrl = base + path;
        document.getElementById('currentUrl').textContent = targetUrl;

        const container = document.getElementById('qrcode');
        container.innerHTML = '';
        qrCode = new QRCode(container, {
            text: targetUrl,
            width: 220,
            height: 220,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    function useLocalhost() {
        const input = document.getElementById('baseUrl');
        input.value = window.location.origin;
        generateQR();
    }

    // 页面加载时自动生成
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('baseUrl').value = getBaseUrl();
        generateQR();
    });
</script>

</body>
</html>
