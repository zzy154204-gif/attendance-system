<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生列表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">学生列表</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/dashboard}">返回首页</a>
            <a class="btn btn-success" th:href="@{/student/add}">新增学生</a>
        </div>
    </div>

    <form class="row g-2 mb-3" th:action="@{/student/list}" method="get">
        <div class="col-auto flex-grow-1">
            <input type="text" class="form-control" name="keyword" placeholder="按姓名或学号搜索" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">搜索</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>班级</th>
                <th>性别</th>
                <th>出生日期</th>
                <th>联系方式</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.studentNumber}">2023001</td>
                <td th:text="${student.name}">张三</td>
                <td th:text="${student.clazz}">软件工程1班</td>
                <td th:text="${student.gender}">男</td>
                <td th:text="${student.birthDate}">2000-01-01</td>
                <td th:text="${student.contact}">13800000000</td>
                <td>
                    <a class="btn btn-sm btn-info" th:href="@{/student/edit/{id}(id=${student.id})}">编辑</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/student/delete/{id}(id=${student.id})}"
                       onclick="return confirm('确定要删除该学生吗？')">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage - 1}, keyword=${keyword})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/student/list(page=${i}, keyword=${keyword})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage + 1}, keyword=${keyword})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
