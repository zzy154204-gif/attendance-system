<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生列表 - 学生考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-xl py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">学生列表</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/dashboard}"><i class="bi bi-house"></i> 返回首页</a>
            <a class="btn btn-success" th:href="@{/student/add}"><i class="bi bi-person-plus"></i> 新增学生</a>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form class="row g-2" th:action="@{/student/list}" method="get">
                <div class="col-md-9">
                    <input type="text" class="form-control" name="keyword" placeholder="按姓名或学号搜索" th:value="${keyword}">
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> 搜索</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>班级</th>
                    <th>性别</th>
                    <th>出生日期</th>
                    <th>联系方式</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.studentNumber}">2023001</td>
                    <td th:text="${student.name}">张三</td>
                    <td th:text="${student.clazz}">软件工程1班</td>
                    <td th:text="${student.gender}">男</td>
                    <td th:text="${student.birthDate}">2000-01-01</td>
                    <td th:text="${student.contact}">13800000000</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/student/edit/{id}(id=${student.id})}">
                            <i class="bi bi-pencil"></i> 编辑
                        </a>
                        <form th:action="@{/student/delete/{id}(id=${student.id})}" method="post"
                              style="display:inline" onsubmit="return confirm('确定要删除该学生吗？')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage - 1}, keyword=${keyword})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/student/list(page=${i}, keyword=${keyword})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage + 1}, keyword=${keyword})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
