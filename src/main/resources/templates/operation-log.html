<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>操作日志 - 课堂考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-xl py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-journal-text me-2"></i>操作日志</h2>
        <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">
            <i class="bi bi-house"></i> 返回控制台
        </a>
    </div>

    <!-- 搜索 -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form class="row g-2" th:action="@{/admin/logs}" method="get">
                <div class="col-md-9">
                    <input type="text" class="form-control" name="username"
                           placeholder="按用户名搜索" th:value="${username}">
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>时间</th>
                    <th>用户</th>
                    <th>操作类型</th>
                    <th>目标</th>
                    <th>详情</th>
                    <th>IP</th>
                    <th>结果</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01</td>
                    <td th:text="${log.username}">admin</td>
                    <td>
                        <span class="badge"
                              th:classappend="${log.operation == 'LOGIN'} ? ' bg-info' :
                                             (${log.operation == 'CHECK_IN'} ? ' bg-success' :
                                             (${log.operation == 'DELETE'} ? ' bg-danger' :
                                             (${log.operation == 'IMPORT'} ? ' bg-warning text-dark' :
                                             (${log.operation == 'EXPORT'} ? ' bg-primary' :
                                             (${log.operation == 'APPROVE_LEAVE'} ? ' bg-success' :
                                              ' bg-secondary')))))"
                              th:text="${log.operation}">CHECK_IN</span>
                    </td>
                    <td th:text="${log.target}">Attendance</td>
                    <td th:text="${log.detail}">-</td>
                    <td th:text="${log.ip}">127.0.0.1</td>
                    <td>
                        <span class="badge"
                              th:classappend="${log.success} ? ' bg-success' : ' bg-danger'"
                              th:text="${log.success} ? '成功' : '失败'">成功</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>暂无操作日志
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/logs(page=${currentPage - 1}, username=${username})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/admin/logs(page=${i}, username=${username})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/logs(page=${currentPage + 1}, username=${username})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
