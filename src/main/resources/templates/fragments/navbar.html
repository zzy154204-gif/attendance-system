<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" th:fragment="navbar">
    <div class="container-xl">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-mortarboard-fill me-2"></i>课堂考勤系统
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>控制台</a>
                </li>
                <!-- 学生专属 -->
                <li class="nav-item" sec:authorize="hasAnyRole('STUDENT','ADMIN')">
                    <a class="nav-link" th:href="@{/attendance/checkIn}"><i class="bi bi-check-circle me-1"></i>打卡</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('STUDENT','ADMIN')">
                    <a class="nav-link" th:href="@{/leave/apply}"><i class="bi bi-file-earmark-text me-1"></i>请假</a>
                </li>
                <!-- 教师/管理员 -->
                <li class="nav-item" sec:authorize="hasAnyRole('TEACHER','ADMIN')">
                    <a class="nav-link" th:href="@{/student/list}"><i class="bi bi-people-fill me-1"></i>学生管理</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('TEACHER','ADMIN')">
                    <a class="nav-link" th:href="@{/course/list}"><i class="bi bi-book me-1"></i>课程管理</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('TEACHER','ADMIN')">
                    <a class="nav-link" th:href="@{/attendance/import}"><i class="bi bi-upload me-1"></i>批量导入</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/attendance/list}"><i class="bi bi-list-ul me-1"></i>考勤记录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leave/list}"><i class="bi bi-journal-text me-1"></i>请假记录</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/logs}"><i class="bi bi-clock-history me-1"></i>操作日志</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name">用户名</span>
                </span>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right me-1"></i>退出
                </a>
            </div>
        </div>
    </div>
</nav>

<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" th:fragment="navbarPublic">
    <div class="container-xl">
        <a class="navbar-brand fw-bold" th:href="@{/login}">
            <i class="bi bi-mortarboard-fill me-2"></i>课堂考勤系统
        </a>
        <div class="d-flex">
            <a class="btn btn-outline-primary btn-sm me-2" th:href="@{/login}">登录</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}">注册</a>
        </div>
    </div>
</nav>
</body>
</html>
