<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 学生考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbarPublic}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">用户注册</h3>

                    <div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control"
                                   placeholder="请输入用户名" th:value="${form?.username}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">角色</label>
                            <select class="form-select" name="role" required>
                                <option value="STUDENT" th:selected="${form?.role == null or form?.role == 'STUDENT'}">🧑‍🎓 学生</option>
                                <option value="TEACHER" th:selected="${form?.role == 'TEACHER'}">👨‍🏫 教师</option>
                                <option value="ADMIN" th:selected="${form?.role == 'ADMIN'}">🛡️ 管理员</option>
                            </select>
                            <div class="form-text">管理员拥有全部权限，可访问教师端和学生端的所有功能。</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认密码</label>
                            <input type="password" name="confirmPassword" class="form-control" placeholder="请再次输入密码" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">注册</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}">已有账号？去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
