<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">学生表单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">
                        <i class="bi bi-person-vcard"></i> <span th:text="${formTitle}">学生表单</span>
                    </h3>
                    <p class="text-muted small">标注 * 的字段为必填。</p>

                    <form th:action="@{${formAction}}" method="post" th:object="${student}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">学号 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{studentNumber}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('studentNumber')}" th:errors="*{studentNumber}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">姓名 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">班级</label>
                                <input type="text" class="form-control" th:field="*{clazz}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">性别 <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{gender}" required>
                                    <option value="">请选择</option>
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">出生日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" th:field="*{birthDate}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">联系方式 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{contact}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4">保存</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/student/list}">返回列表</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
