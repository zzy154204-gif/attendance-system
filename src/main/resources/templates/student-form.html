<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">学生表单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4" th:text="${formTitle}">学生表单</h3>

                    <p class="text-muted small">标注 * 的字段为必填。</p>

                    <form th:action="@{${formAction}}" method="post" th:object="${student}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">学号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{studentNumber}" placeholder="请输入学号" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('studentNumber')}" th:errors="*{studentNumber}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="请输入姓名" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">班级</label>
                            <input type="text" class="form-control" th:field="*{clazz}" placeholder="请输入班级">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">性别 <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}" required>
                                <option value="">请选择</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">出生日期 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{birthDate}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">联系方式 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{contact}" placeholder="手机号或邮箱" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">保存</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/student/list}">返回列表</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
