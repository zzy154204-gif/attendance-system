<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title">首页</h3>
            <p class="lead" th:text="${welcomeMsg}">欢迎进入系统</p>
            <div class="d-flex flex-wrap gap-2 mt-3">
                <a class="btn btn-primary" th:href="@{/student/list}">学生列表</a>
                <a class="btn btn-success" th:href="@{/student/add}">新增学生</a>
                <a class="btn btn-outline-secondary" th:href="@{/logout}">退出登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
