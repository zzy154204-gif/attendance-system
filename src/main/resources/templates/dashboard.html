<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title">系统首页</h3>
            <p class="text-muted mb-2" th:text="${welcomeMsg}">欢迎进入系统</p>
            <span class="badge text-bg-secondary mb-4">当前角色：<span th:text="${roleLabel}">学生</span></span>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-person-workspace"></i> 教师端</h5>
                            <p class="text-muted">查看考勤记录、导出数据、管理学生信息。</p>
                            <span class="badge text-bg-warning mb-2">仅教师账号</span>
                            <a class="btn btn-primary" th:href="@{/teacher/dashboard}">进入教师端</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-person"></i> 学生端</h5>
                            <p class="text-muted">考勤打卡、查看个人记录。</p>
                            <span class="badge text-bg-success mb-2">仅学生账号</span>
                            <a class="btn btn-success" th:href="@{/student/dashboard}">进入学生端</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
