<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录 - 学生考勤系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-card-list"></i> 考勤记录</h3>
        <a class="btn btn-outline-success" th:if="${isTeacher}"
           th:href="@{/attendance/export(startDate=${startDate}, endDate=${endDate}, status=${status}, courseId=${courseId})}">
            <i class="bi bi-download"></i> 导出
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${successMsg}" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMsg}" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form th:action="@{/attendance/list}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">开始日期</label>
                    <input type="date" class="form-control" name="startDate" th:value="${startDate}" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">结束日期</label>
                    <input type="date" class="form-control" name="endDate" th:value="${endDate}" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">状态</label>
                    <select class="form-select" name="status">
                        <option value="">全部状态</option>
                        <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                        <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                        <option value="EARLY" th:selected="${status == 'EARLY'}">早退</option>
                        <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">课程</label>
                    <select class="form-select" name="courseId">
                        <option value="">全部课程</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:selected="${courseId != null} ? ${courseId == course.id} : false"
                                th:text="${course.name}">
                            Java程序设计
                        </option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> 查询</button>
                    <a class="btn btn-outline-secondary" th:href="@{/attendance/list(range='today')}">今天</a>
                    <a class="btn btn-outline-secondary" th:href="@{/attendance/list(range='week')}">本周</a>
                    <a class="btn btn-outline-secondary" th:href="@{/attendance/list(range='month')}">本月</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>日期</th>
                    <th>课程</th>
                    <th>打卡时间</th>
                    <th>状态</th>
                    <th>备注</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${#temporals.format(record.checkInTime, 'yyyy-MM-dd')}">2024-01-01</td>
                    <td th:text="${record.courseName}">Java程序设计</td>
                    <td th:text="${#temporals.format(record.checkInTime, 'HH:mm:ss')}">08:00:00</td>
                    <td>
                        <span class="badge"
                              th:classappend="${record.status == 'NORMAL'} ? ' bg-success' :
                                             (${record.status == 'LATE'} ? ' bg-warning text-dark' :
                                             (${record.status == 'EARLY'} ? ' bg-info' : ' bg-danger'))"
                              th:text="${record.status == 'NORMAL'} ? '正常' :
                                       (${record.status == 'LATE'} ? '迟到' :
                                       (${record.status == 'EARLY'} ? '早退' : '缺勤'))">
                            正常
                        </span>
                    </td>
                    <td th:text="${record.remark}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/attendance/list(page=${currentPage - 1}, startDate=${startDate}, endDate=${endDate}, status=${status}, courseId=${courseId})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/attendance/list(page=${i}, startDate=${startDate}, endDate=${endDate}, status=${status}, courseId=${courseId})}"
                   th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/attendance/list(page=${currentPage + 1}, startDate=${startDate}, endDate=${endDate}, status=${status}, courseId=${courseId})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/theme-script :: scripts}"></div>
</body>
</html>
